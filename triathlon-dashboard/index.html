<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Triatlo — Login</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="auth-wrap">
  <form id="loginForm" class="auth-card">
    <h1>Dashboard Triatlo</h1>
    <p class="muted">Inicia sessão com a conta que o teu coach criou para ti.</p>
    <label>Email
      <input type="email" id="email" required autocomplete="username" />
    </label>
    <label>Password
      <input type="password" id="password" required autocomplete="current-password" />
    </label>
    <p id="loginError" class="form-error" role="alert"></p>
    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
  </form>
</div>
<script type="module" src="js/auth.js"></script>
</body>
</html>
